name: Fork release (Windows x64)

# Fork-only (Dazzuh/oh-my-pi); see docs/fork/README.md.
#
# A `v<upstream version>-dz.<n>` tag on `main` builds the Windows x64
# single-file binary (fork-build-windows.yml) and publishes it with its
# SHA-256 as a GitHub release. Nothing is published anywhere else.

on:
   push:
      tags: ["v*-dz.*"]
   workflow_dispatch:
      inputs:
         tag:
            description: "Existing release tag to (re)build, e.g. v18.19.0-dz.1"
            required: true
            type: string
         dry_run:
            description: "Build only; publish nothing (tests this workflow)"
            required: false
            type: boolean
            default: false

concurrency:
   group: fork-release-${{ inputs.tag || github.ref_name }}
   cancel-in-progress: false

permissions:
   contents: read

env:
   RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
   check_tag:
      name: Check tag
      runs-on: ubuntu-22.04
      outputs:
         version: ${{ steps.tag.outputs.version }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: refs/tags/${{ env.RELEASE_TAG }}
              fetch-depth: 0
              persist-credentials: false

         - name: Check tag
           id: tag
           run: |
              set -euo pipefail
              if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-dz\.([0-9]+)$ ]]; then
                echo "::error::$RELEASE_TAG is not v<upstream version>-dz.<n>"
                exit 1
              fi
              upstream="${BASH_REMATCH[1]}"
              n="${BASH_REMATCH[2]}"
              package_version=$(jq -r .version packages/coding-agent/package.json)
              if [ "$upstream" != "$package_version" ]; then
                echo "::error::$RELEASE_TAG names $upstream but packages/coding-agent/package.json is $package_version"
                exit 1
              fi
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor HEAD origin/main; then
                echo "::error::$RELEASE_TAG ($(git rev-parse --short HEAD)) is not on main"
                exit 1
              fi
              echo "version=$upstream+dz.$n" >> "$GITHUB_OUTPUT"

   build:
      name: Build
      needs: check_tag
      uses: ./.github/workflows/fork-build-windows.yml
      with:
         ref: refs/tags/${{ inputs.tag || github.ref_name }}
         version: ${{ needs.check_tag.outputs.version }}

   publish:
      name: Publish GitHub release
      needs: [check_tag, build]
      if: ${{ !inputs.dry_run }}
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-windows-x64
              path: dist

         - name: Publish
           env:
              GH_TOKEN: ${{ github.token }}
              FORK_VERSION: ${{ needs.check_tag.outputs.version }}
           run: |
              set -euo pipefail
              cd dist
              sha256sum -c omp-windows-x64.exe.sha256
              commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
              notes="omp $FORK_VERSION for Windows x64, built from $commit by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. See docs/fork/README.md."
              if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                gh release upload "$RELEASE_TAG" omp-windows-x64.exe omp-windows-x64.exe.sha256 --clobber -R "$GITHUB_REPOSITORY"
              else
                gh release create "$RELEASE_TAG" omp-windows-x64.exe omp-windows-x64.exe.sha256 \
                  --verify-tag --title "$RELEASE_TAG" --notes "$notes" -R "$GITHUB_REPOSITORY"
              fi
